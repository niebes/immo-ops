# Canonical listing statuses
# Used by tracker mode and verify-pipeline.mjs

statuses:
  - name: New
    description: Discovered, not yet evaluated
  - name: Evaluated
    description: Scored, pending decision
  - name: Interested
    description: User wants to pursue
  - name: Swap-candidate
    description: >-
      Tauschwohnung that passed two-sided matching — their flat fits us (blocks A–H)
      AND one of our swap_offer flats plausibly satisfies their Suche. Pending contact +
      Vermieter consent. A swap that fails the two-sided gate is Discarded with note
      "swap-mismatch".
  - name: Contacted
    description: Contacted landlord/agency
  - name: Viewing
    description: Viewing scheduled
  - name: Viewed
    description: Viewing completed
  - name: Applied
    description: Selbstauskunft/application submitted
  - name: Accepted
    description: Offer accepted by landlord
    terminal: true
  - name: Rejected
    description: Rejected by landlord
    terminal: true
  - name: Discarded
    description: >-
      Discarded by the user — including a flat viewed in person and then declined
      (not a landlord rejection; that is Rejected). Terminal. route-decided.mjs
      auto-skips any future re-list matching a Discarded row, so the decision
      sticks across portals without re-evaluation.
    terminal: true
  - name: Expired
    description: Listing removed from portal
    terminal: true
