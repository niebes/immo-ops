# immo-ops Portal Configuration
# Copy to portals.yml and customize.
#
# Structure: search_groups — one group per search target from config/profile.yml.
# The `name` field must match the corresponding `searches[].name` in profile.yml.

search_groups:

  # ═══════════════════════════════════════════════════════════
  # Example: Flat rental
  # ═══════════════════════════════════════════════════════════
  - name: "Berlin flat rental"
    scan_defaults:
      search_type: miete
      property_type: wohnung
      city: Berlin
      price_max: 1500
      rooms_min: 2
      size_min: 60

    portals:
      - name: ImmoScout24
        enabled: true
        scan_method: cic
        search_url: "https://www.immobilienscout24.de/Suche/de/berlin/berlin/wohnung-mieten?price=-1500.0&livingspace=60.0-&numberofrooms=2.0-&pricetype=calculatedtotalrent"
        captcha_risk: high
        notes: "Largest German portal. Blocks Playwright — use CiC. CAPTCHA may need manual solve."

      - name: Immowelt
        enabled: true
        scan_method: playwright
        search_url: "https://www.immowelt.de/liste/berlin/wohnungen/mieten?ami=60&pma=1500&rmi=2&sort=relevanz"
        rate_limit: 3

      - name: Kleinanzeigen
        enabled: true
        scan_method: playwright
        search_url: "https://www.kleinanzeigen.de/s-wohnung-mieten/berlin/c203l3331"
        rate_limit: 5
        notes: "Private listings. High scam risk on cheap offers."

      - name: Degewo
        enabled: true
        scan_method: playwright
        search_url: "https://immosuche.degewo.de/de/search"
        rate_limit: 3
        notes: "Largest Berlin municipal housing."

      - name: Sparkasse Immobilien
        enabled: true
        scan_method: websearch
        search_query: "site:sparkassen-immobilien.de Berlin Mietwohnung"
        rate_limit: 5

    title_filter:
      positive: []
      negative:
        - WBS
        - Zwischenmiete
        - befristet
        - Tauschwohnung
        - Wohnungstausch
        - Tausche
        - "gegen Wohnung"
        - Untermiete
        - Gewerbe
        - "Büro"
        - Stellplatz
        - Garage

