# immo-ops Profile Configuration
# Copy to config/profile.yml and fill in your details.

searcher:
  full_name: "Max Mustermann"
  email: "max@example.com"
  phone: "+49-..."
  notification_email: "max@example.com"  # Where scan alerts go (can differ from contact email)

# Multiple search types supported. Each gets its own portal filters and scoring weights.
searches:
  - name: "Berlin flat rental"
    enabled: true        # Set false to pause this search without deleting it.
                         # scan.mjs / portal-url.mjs skip disabled searches.
    type: miete          # miete | kauf
    property: wohnung    # wohnung | haus | grundstueck | freizeitgrundstueck
    include_swaps: false # true = KEEP Tauschwohnungen (apartment swaps) instead of
                         # discarding them, and run a two-sided match against the
                         # `swap_offer:` block below. Only useful if you have a flat
                         # to offer in exchange.
    location:
      city: Berlin
      preferred_areas:
        - Kreuzberg
        - Friedrichshain
        - Neukölln
      acceptable_areas:
        - Charlottenburg
        - Schöneberg
        - Tempelhof
      excluded_areas:
        - Marzahn
        - Spandau
    price:
      max_kaltmiete: 1500
      max_warmmiete: 1800
      max_price_per_m2: 18
    size:
      min_m2: 60
      max_m2: 120
      min_rooms: 2.5
      max_rooms: 4
    must_haves:
      - balkon_or_terrasse
      - einbaukueche
      - haustiere_erlaubt
    nice_to_haves:
      - garten
      - keller
      - stellplatz
      - aufzug
      - badewanne
      - waschmaschine_anschluss
    deal_breakers:
      - no_wbs_required
      - no_zwischenmiete
      - min_energieeffizienz: "D"
    availability:
      # Use "flexible" (or leave empty) when you have no fixed move-in date —
      # listings are then not scored against a window or flagged as early/late.
      # Or set real ISO dates to score by alignment, e.g.:
      #   earliest_move_in: "2026-07-01"
      #   latest_move_in: "2026-09-01"
      earliest_move_in: flexible
      latest_move_in: flexible

  # Additional search examples — uncomment and customize:
  #
  # - name: "House purchase"
  #   enabled: false           # keep configured but paused
  #   type: kauf
  #   property: haus
  #   location:
  #     city: Berlin
  #     preferred_areas: []
  #     acceptable_areas: []
  #     excluded_areas: []
  #   price:
  #     max_kaufpreis: 500000
  #     max_price_per_m2: 4000
  #   size:
  #     min_m2: 80
  #     max_m2: 150
  #     min_rooms: 4
  #     max_rooms: 5
  #   must_haves:
  #     - garten
  #
  # - name: "Plot purchase"
  #   enabled: false
  #   type: kauf
  #   property: grundstueck
  #   location:
  #     city: Brandenburg
  #     preferred_areas: []
  #     acceptable_areas: []
  #     excluded_areas: []
  #   price:
  #     max_kaufpreis: 200000
  #     max_price_per_m2: 200
  #   size:
  #     min_m2: 500
  #
  # - name: "Leisure plot (Freizeitgrundstück)"
  #   enabled: false
  #   type: kauf
  #   property: freizeitgrundstueck   # leisure/garden plot — no building intent
  #   location:
  #     city: Brandenburg
  #     preferred_areas: []
  #     acceptable_areas: []
  #     excluded_areas: []
  #   price:
  #     max_kaufpreis: 60000
  #     min_kaufpreis: 1000           # floor filters out ads/leases masquerading as sales

# ── Swap offer (Tauschwohnung) — the flat(s) YOU put up in a swap ──────────────
# Only relevant when a search sets `include_swaps: true`. Enables two-sided matching:
# a Tauschwohnung listing is kept only if BOTH sides fit — (1) THEIR flat scores well
# for you (normal blocks A–H, ≥3.5 gate) AND (2) one of YOUR flats below plausibly
# satisfies THEIR stated Suche (matching is lenient / recall-favoring).
# Uncomment and describe your current flat(s):
#
# swap_offer:
#   - flat: my-flat                  # short slug for this offer
#     available: true
#     address: "Musterstraße 1, 12345 Berlin"
#     location:
#       city: Berlin
#       ortsteil: Kreuzberg
#       plz: "12345"
#     size_m2: 65
#     rooms: 2
#     etage: 3. OG
#     aufzug: false
#     kaltmiete: 900.00
#     nebenkosten: 200.00
#     warmmiete: 1100.00
#     kaution: 2700.00               # typically 3× Kaltmiete
#     rent_type: standard            # standard | indexmiete | staffelmiete
#     baujahr: 1995
#     features:                      # what the flat HAS (swap partners search for these)
#       - balkon
#       - einbaukueche
#     lacks:                         # explicitly NOT present — a partner's Suche for
#       - garten                     # these cannot be met by this flat
#       - stellplatz
#     energieausweis: null           # class if known, else null
#     earliest_handover: null        # ISO date or null if unknown
#     # Consent gate: a swap is a Mieterwechsel and needs your Vermieter's approval.
#     # Treat all swap candidates as speculative until this is confirmed.
#     landlord_consent: unknown      # unknown | requested | granted | denied
#     caveats:
#       - "Anything a swap partner must be told upfront (Indexmiete, disputes, ...)"

commute:
  destinations:
    - address: "Alexanderplatz, Berlin"
      label: "Office"
      mode: transit     # transit | bike | car
      max_minutes: 40

# Renter documents (for Selbstauskunft generation)
documents:
  monthly_net_income: 3500
  employment_type: unbefristet    # unbefristet | befristet | selbststaendig
  employer: "Company GmbH"
  schufa_available: true
  previous_landlord_reference: true
  number_of_persons: 2
  pets:
    - type: Katze
      count: 1
  smoker: false

# ── Applicants (Mieter) — full per-person profiles for the Mieterselbstauskunft ──
# One entry per applicant (a two-person household has two). Use `null` for anything you
# have not verified — the Selbstauskunft is a legally binding truthful declaration, so
# never guess a value. Fill these in your gitignored config/profile.yml, NOT here.
applicants:
  - role: mieter_1
    vorname_name: "Max Mustermann"
    geburtsdatum: "YYYY-MM-DD"
    staatsangehoerigkeit: "deutsch"
    familienstand: "ledig"            # ledig | verheiratet | ...
    anschrift: "Straße Nr., PLZ Ort"
    vorherige_anschrift: null         # previous address + period, if recently moved
                                      # (landlords cross-check against payslip/SCHUFA)
    telefon_privat: null
    mobil: "+49 ..."
    email: "name@example.com"
    telefon_geschaeftlich: null
    bisheriger_vermieter:
      name: null
      anschrift: null
      telefon: null
    arbeitgeber:
      name: "Company GmbH"
      anschrift: null
      telefon: null
    letzter_arbeitgeber: null         # last employer + period, if currently not employed
    beschaeftigt_seit: "YYYY-MM-DD"
    employment_type: unbefristet      # unbefristet | befristet | selbststaendig
    befristet_bis: null
    beruf: null
    netto_einkommen: 3500
    einkommensart: null               # e.g. "Gehalt" | "Sozialleistungen" | "selbstständig"
                                      # — state it when income is not regular employment pay
    schufa_vorhanden: true
    schufa_datum: null                # must be < 3 months old
    schufa_typ: null                  # e.g. "SCHUFA-BonitätsCheck" or "Datenübersicht §34 BDSG"
    schufa_datei: null                # path to the PDF, e.g. "documents/Schufa-YYYY-MM-DD.pdf"
  # - role: mieter_2
  #     ... (same fields for a second applicant)

household:
  number_of_persons: 2
  relationship: null                  # e.g. "Paar / Partner"
  haustiere: null                     # "keine" or type/count
  musikinstrumente: null              # "keine" or list
  raucher: false
  household_net_income: null          # combined net income of all applicants (EUR/month)
  move_in_preferred: null             # e.g. "2026-09-01" — preferred move-in date
  reason_for_moving: null             # short honest sentence, used in contact drafts

